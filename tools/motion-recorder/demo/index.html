<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>motion-recorder demo</title>
<link rel="icon" href="data:,">
<style>
  :root { --ease: cubic-bezier(.16, 1, .3, 1); --ink: #14171a; --bg: #f6f4ef; --accent: #b4543f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.6 Georgia, serif; color: var(--ink); background: var(--bg); }
  section { min-height: 90vh; padding: 14vh 8vw; }
  h1 { font-size: clamp(48px, 9vw, 120px); line-height: .95; letter-spacing: -.03em; margin: 0; }
  h2 { font-size: clamp(32px, 5vw, 64px); line-height: 1; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; }
  .card { background: #fff; padding: 28px; border-top: 6px solid var(--accent); min-height: 220px; }
  [data-reveal] { opacity: 0; transform: translateY(30px); transition: opacity .9s var(--ease), transform .7s var(--ease); }
  [data-reveal].in { opacity: 1; transform: none; }
  .banner { background: var(--accent); color: #fff; padding: 40px 8vw; font-size: 22px; }
  @media (prefers-reduced-motion: reduce) { [data-reveal] { transform: none; transition: opacity .3s linear; } }
</style>
</head>
<body>
<section><h1>Scroll me.</h1><p>A small page with scroll reveals. Open it with <code>?jank=1</code> to add the two classic mistakes the recorder is built to catch.</p></section>
<section><h2 data-reveal>Cards that rise</h2>
  <div class="grid">
    <div class="card" data-reveal>One</div><div class="card" data-reveal>Two</div><div class="card" data-reveal>Three</div>
  </div>
</section>
<section><h2 data-reveal>Another section</h2><p data-reveal>Transform finishes before opacity, expo-out curve, 30 px rise.</p></section>
<section><h2 data-reveal>The end</h2></section>
<script>
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }));
  document.querySelectorAll("[data-reveal]").forEach((el) => io.observe(el));
  if (new URLSearchParams(location.search).has("jank")) {
    // Mistake 1: heavy work inside a scroll handler, so scrolling stutters.
    let busy = false;
    addEventListener("scroll", () => { if (busy) return; busy = true; const t = performance.now(); while (performance.now() - t < 120) {} setTimeout(() => (busy = false), 400); }, { passive: true });
    // Mistake 2: a banner inserted at the top after load, pushing all content down.
    setTimeout(() => { const b = document.createElement("div"); b.className = "banner"; b.textContent = "Late banner: everything below just jumped."; document.body.prepend(b); }, 700);
  }
</script>
</body>
</html>
